<title>Garden</title>
<script>
  // Применяем сохранённую тему ещё до отрисовки страницы, чтобы избежать "вспышки" неверной темы.
  try {
    // Список и режимы должны совпадать с GARDEN_THEMES в js/lib/interactions.js.
    const THEME_MODES = {
      'chernika': 'light', 'myata': 'light', 'lavanda': 'light', 'tuman': 'light',
      'grafit': 'dark', 'khvoya': 'dark', 'noch': 'dark',
      'anuppuccin-latte': 'light', 'anuppuccin-mocha': 'dark',
    };
    const THEMES = Object.keys(THEME_MODES);
    // Темы с настраиваемым акцентом — должно совпадать с ACCENT_THEMES в js/lib/interactions.js.
    const ACCENT_THEMES = ['anuppuccin-latte', 'anuppuccin-mocha'];
    const ACCENT_NAMES = ['rosewater', 'flamingo', 'pink', 'mauve', 'red', 'maroon', 'peach', 'yellow', 'green', 'teal', 'sky', 'lavender'];
    // Для новых пользователей используем AnuPpuccin Latte независимо от системной темы.
    // Сохранённый пользовательский выбор по-прежнему имеет приоритет.
    const defaultTheme = 'anuppuccin-latte';
    let savedTheme = localStorage.getItem('garden-theme') || defaultTheme;
    if (!THEMES.includes(savedTheme)) savedTheme = defaultTheme;
    localStorage.setItem('garden-theme', savedTheme);
    // Все пользовательские темы применяются явным классом; базовые :root-токены служат только fallback.
    document.documentElement.classList.add(`theme-${savedTheme}`);
    if (THEME_MODES[savedTheme] === 'dark') document.documentElement.classList.add('theme-dark');
    // Акцентный цвет применяем тем же способом, что и тему — до отрисовки, чтобы
    // не мигать цветом по умолчанию для тем с поддержкой настройки акцента.
    if (ACCENT_THEMES.includes(savedTheme)) {
      let savedAccent = localStorage.getItem('garden-accent');
      if (!ACCENT_NAMES.includes(savedAccent)) savedAccent = 'green';
      localStorage.setItem('garden-accent', savedAccent);
      document.documentElement.classList.add(`accent-${savedAccent}`);
    }
  } catch (e) {}
</script>
