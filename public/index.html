<title>Garden</title>
<script src="/js/domain/appearance-config.js"></script>
<script>
  // Применяем сохранённое оформление до первого рендера, чтобы не было FOUC.
  try {
    const cfg = GardenAppearance;
    let savedTheme = localStorage.getItem('garden-theme') || cfg.defaultTheme;
    if (!cfg.themeValues.includes(savedTheme)) savedTheme = cfg.defaultTheme;
    localStorage.setItem('garden-theme', savedTheme);
    document.documentElement.classList.add(`theme-${savedTheme}`);
    if (cfg.themeModes[savedTheme] === 'dark') document.documentElement.classList.add('theme-dark');
    if (cfg.accentThemes.includes(savedTheme)) {
      let savedAccent = localStorage.getItem('garden-accent');
      if (!cfg.accentValues.includes(savedAccent)) savedAccent = cfg.defaultAccent;
      localStorage.setItem('garden-accent', savedAccent);
      document.documentElement.classList.add(`accent-${savedAccent}`);
    }
    if (cfg.themeModes[savedTheme] === 'dark' && localStorage.getItem('garden-glow') === '1') document.documentElement.classList.add('glow-enabled');
  } catch (e) {}
</script>
